name: Update widget cards

on:
  schedule:
    - cron: '17 * * * *'     # hourly, off the hour to avoid GitHub's cron rush -- was every
                              # 4h, but the last-commit card's "Xh/m ago" text is only ever as
                              # fresh as the last render: right after a push it's accurate, then
                              # it just sits there getting more wrong until the next trigger.
                              # Push events cover new commits instantly; this covers the long
                              # quiet stretches between them.
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]         # so the last-commit card updates the moment a commit lands,
                              # not up to 4h later -- the bot's own commit is [skip ci],
                              # which GitHub Actions honors on push, so this doesn't loop

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Build Steam card
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_steam_card.py

      - name: Build Spotify card
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_spotify_card.py

      - name: Build last-commit card
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_last_commit_card.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/steam_card.png assets/spotify_card.png assets/last_commit_card.png
          git diff --staged --quiet || git commit -m "chore: refresh widget cards [skip ci]"
          git push
