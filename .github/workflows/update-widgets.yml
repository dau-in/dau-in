name: Update widget cards

on:
  # No `schedule:` trigger anymore -- GitHub's own cron for this repo proved
  # unreliable (confirmed directly: it sat idle for 10+ hours at a stretch,
  # a known "best-effort, no SLA" platform limitation, not something fixable
  # from this file). Reliable periodic refresh now comes from an external
  # pinger (cron-job.org) hitting this same workflow via workflow_dispatch
  # every 30 minutes -- keeping GitHub's schedule alongside that would just
  # be a second, uncontrolled trigger source with no benefit and a real risk
  # of two runs landing close together (see concurrency: below for why that
  # matters).
  workflow_dispatch: {}       # cron-job.org calls this externally; also lets you trigger a run manually from the Actions tab
  push:
    branches: [main]         # so the last-commit card updates the moment a commit lands,
                              # not up to 30 min later -- the bot's own commit is [skip ci],
                              # which GitHub Actions honors on push, so this doesn't loop

permissions:
  contents: write

# Without this, a push-triggered run and a workflow_dispatch run (from the
# external cron, or triggered by hand) landing close together would both try
# to build cards and `git push` around the same time -- whichever finishes
# second would get a non-fast-forward rejection, since the "Commit if
# changed" step below has no pull/rebase/retry logic. cancel-in-progress:
# false queues the second run to start only once the first finishes,
# instead of cancelling it or letting both race -- every triggering event
# still gets its own complete run, just not run in parallel.
concurrency:
  group: update-widgets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Build Steam card
        id: steam
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_steam_card.py

      - name: Build Spotify card
        id: spotify
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_spotify_card.py

      - name: Build last-commit card
        id: last_commit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_last_commit_card.py

      - name: Build WakaTime card
        id: wakatime
        continue-on-error: true
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_wakatime_card.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/steam_card.png assets/spotify_card.png assets/last_commit_card.png assets/last_commit_url.txt assets/last_commit_meta.json assets/wakatime_card.png
          git diff --staged --quiet && exit 0
          # Only regenerate README.md (which rotates the cache-busting query
          # param on each auto-rebuilt card's <img src>, see build_readme.py)
          # when a card actually changed -- otherwise every 30-min run would
          # force a commit purely to rotate a cache-buster nothing needed,
          # drowning the repo's real history in bot noise. This is also why
          # raw.githubusercontent.com serving a stale card for a while isn't
          # solved by rebuilding the PNG alone: the README's <img> URL has to
          # change too, or viewers' browsers/GitHub's CDN just keep re-using
          # their cached copy of the old URL.
          python build_readme.py
          git add README.md
          git commit -m "chore: refresh widget cards [skip ci]"
          # concurrency: above already keeps two runs of this workflow from
          # overlapping, but this stays as a second line of defense against
          # any push that lands on main between checkout and here (from
          # local work, not this workflow) -- rebase onto it instead of
          # failing outright on a plain rejected push.
          git pull --rebase
          git push

      # Every build step above is continue-on-error, so one dead API (a
      # revoked Steam key, an expired Spotify refresh token, a rotated
      # WakaTime key) leaves the other three cards building normally and the
      # commit going through -- which is the point, one broken widget
      # shouldn't take the whole profile down with it. The cost is that
      # nothing surfaces the breakage: the job goes green, the card just
      # keeps showing whatever it last rendered, forever, and the only trace
      # is a yellow annotation nobody opens the Actions tab to see.
      # This step re-reads those outcomes at the end and fails the run if any
      # of them failed, which is what actually triggers GitHub's own
      # "workflow failed" email. Deliberately NOT a staleness check on the
      # asset files -- a card can legitimately render byte-identical for
      # hours (nothing played, no commits), so file age would cry wolf.
      - name: Report card failures
        if: always()
        run: |
          failed=""
          for entry in "steam:${{ steps.steam.outcome }}"                        "spotify:${{ steps.spotify.outcome }}"                        "last-commit:${{ steps.last_commit.outcome }}"                        "wakatime:${{ steps.wakatime.outcome }}"; do
            name="${entry%%:*}"
            outcome="${entry##*:}"
            if [ "$outcome" = "failure" ]; then
              echo "::error title=Card build failed::$name -- its card is now frozen at whatever it last rendered"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed card builds:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All four cards built." >> "$GITHUB_STEP_SUMMARY"
