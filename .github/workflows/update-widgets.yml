name: Update widget cards

on:
  # No `schedule:` trigger anymore -- GitHub's own cron for this repo proved
  # unreliable (confirmed directly: it sat idle for 10+ hours at a stretch,
  # a known "best-effort, no SLA" platform limitation, not something fixable
  # from this file). Reliable periodic refresh now comes from an external
  # pinger (cron-job.org) hitting this same workflow via workflow_dispatch
  # every 30 minutes -- keeping GitHub's schedule alongside that would just
  # be a second, uncontrolled trigger source with no benefit and a real risk
  # of two runs landing close together (see concurrency: below for why that
  # matters).
  workflow_dispatch: {}       # cron-job.org calls this externally; also lets you trigger a run manually from the Actions tab
  push:
    branches: [main]         # so the last-commit card updates the moment a commit lands,
                              # not up to 30 min later -- the bot only ever pushes to the
                              # `cards` branch, which this trigger ignores, so this doesn't loop

permissions:
  contents: write

# Without this, a push-triggered run and a workflow_dispatch run (from the
# external cron, or triggered by hand) landing close together would both try
# to build cards and `git push` around the same time -- whichever finishes
# second would get a non-fast-forward rejection, since the "Commit if
# changed" step below has no pull/rebase/retry logic. cancel-in-progress:
# false queues the second run to start only once the first finishes,
# instead of cancelling it or letting both race -- every triggering event
# still gets its own complete run, just not run in parallel.
concurrency:
  group: update-widgets
  cancel-in-progress: false

jobs:
  update:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on
    # 2026-10-19: headless Chrome is the fragile part of this job, and a
    # runner image swap should be a deliberate change here, not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Seed the generated cards from the cards branch
        # The four rebuilt cards no longer live on main, so a fresh checkout
        # doesn't have them. Restore whatever is currently published before
        # building: any card whose build fails (every build step is
        # continue-on-error) then keeps its last good image instead of
        # vanishing from the profile. last_commit_meta.json comes along too:
        # it's the last-commit card's memory of the freshest commit it has
        # shown, so a laggy run can't regress the card backward.
        run: |
          mkdir -p assets
          git fetch -q origin cards || exit 0
          for f in steam_card.png spotify_card.png last_commit_card.png wakatime_card.png last_commit_meta.json; do
            git show "FETCH_HEAD:$f" > "assets/$f" 2>/dev/null || rm -f "assets/$f"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Build Steam card
        id: steam
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_steam_card.py

      - name: Build Spotify card
        id: spotify
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_spotify_card.py

      - name: Build last-commit card
        id: last_commit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_last_commit_card.py

      - name: Build WakaTime card
        id: wakatime
        continue-on-error: true
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python scripts/build_wakatime_card.py

      - name: Publish the cards
        if: always()
        # Everything this workflow produces goes to the `cards` branch,
        # rewritten as one parentless commit each time, so that history never
        # accumulates. Main is not touched at all: it holds only human commits.
        # Main used to take a bot commit per refresh -- first ~450KB of PNGs
        # (91 of the repo's 92 MiB of history was old copies of four images),
        # then just a README edit to rotate a cache-busting query and update
        # the last-commit link. Both are gone: raw.githubusercontent.com caps a
        # stale card at 5 minutes on its own, and the card links somewhere
        # fixed. See build_readme.py.
        run: |
          idx="$RUNNER_TEMP/cards-index"
          rm -f "$idx"
          GIT_INDEX_FILE="$idx" git read-tree --empty
          for f in steam_card.png spotify_card.png last_commit_card.png wakatime_card.png last_commit_meta.json; do
            [ -f "assets/$f" ] || continue
            sha=$(git hash-object -w "assets/$f")
            GIT_INDEX_FILE="$idx" git update-index --add --cacheinfo 100644,"$sha","$f"
          done
          tree=$(GIT_INDEX_FILE="$idx" git write-tree)
          rm -f "$idx"

          git fetch -q origin cards || true
          old_tree=$(git rev-parse -q --verify FETCH_HEAD^{tree} || true)
          if [ "$tree" = "$old_tree" ]; then
            echo "Nothing changed since the last publish."
            exit 0
          fi

          # No -p: each refresh replaces the branch rather than extending it,
          # which is the whole point -- an accumulating branch would just move
          # the weight problem instead of solving it.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          commit=$(git commit-tree "$tree" -m "cards: refreshed $(date -u +%FT%TZ)")
          git push --force origin "$commit:refs/heads/cards"

      # Every build step above is continue-on-error, so one dead API (a
      # revoked Steam key, an expired Spotify refresh token, a rotated
      # WakaTime key) leaves the other three cards building normally and the
      # commit going through -- which is the point, one broken widget
      # shouldn't take the whole profile down with it. The cost is that
      # nothing surfaces the breakage: the job goes green, the card just
      # keeps showing whatever it last rendered, forever, and the only trace
      # is a yellow annotation nobody opens the Actions tab to see.
      # This step re-reads those outcomes at the end and fails the run if any
      # of them failed, which is what actually triggers GitHub's own
      # "workflow failed" email. Deliberately NOT a staleness check on the
      # asset files -- a card can legitimately render byte-identical for
      # hours (nothing played, no commits), so file age would cry wolf.
      - name: Report card failures
        if: always()
        run: |
          failed=""
          for entry in "steam:${{ steps.steam.outcome }}"                        "spotify:${{ steps.spotify.outcome }}"                        "last-commit:${{ steps.last_commit.outcome }}"                        "wakatime:${{ steps.wakatime.outcome }}"; do
            name="${entry%%:*}"
            outcome="${entry##*:}"
            if [ "$outcome" = "failure" ]; then
              echo "::error title=Card build failed::$name -- its card is now frozen at whatever it last rendered"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed card builds:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All four cards built." >> "$GITHUB_STEP_SUMMARY"
